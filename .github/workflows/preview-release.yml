name: Publish preview release
on:
  push:
    branches: [main]
    paths: ['release-assets/**']
    tags: ['v*-preview']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify staged artifacts
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS
      - name: Publish experimental build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v0.1.4-preview --target "$GITHUB_SHA" --prerelease --title "魔兽争霸3冰封王座 Switch 0.1.4" --notes-file RELEASE.md release-assets/*
